apiVersion: v1
kind: Pod
metadata:
  name: backend
  labels:
    app: backend
spec:
  containers:
    - name: httpd
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          mkdir -p /www && echo "hello from backend pod $(hostname)" > /www/index.html
          # FIX: listen on all interfaces (0.0.0.0), so the pod IP is reachable
          exec httpd -f -v -p 0.0.0.0:8080 -h /www
      ports:
        - containerPort: 8080
