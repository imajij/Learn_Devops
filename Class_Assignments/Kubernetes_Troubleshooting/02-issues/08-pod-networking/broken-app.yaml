apiVersion: v1
kind: Pod
metadata:
  name: backend
  labels:
    app: backend
spec:
  containers:
    - name: httpd
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          mkdir -p /www && echo "hello from backend pod $(hostname)" > /www/index.html
          # BUG: binds only to the loopback interface
          exec httpd -f -v -p 127.0.0.1:8080 -h /www
      ports:
        - containerPort: 8080
