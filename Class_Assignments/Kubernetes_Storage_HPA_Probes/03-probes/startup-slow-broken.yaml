# The app needs ~20 s to start, but the startupProbe only allows 3 x 2 s = 6 s.
apiVersion: v1
kind: Pod
metadata:
  name: slow-start
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      command: ["sh", "-c", "echo 'warming up for 20s...'; sleep 20; exec nginx -g 'daemon off;'"]
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 2
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
