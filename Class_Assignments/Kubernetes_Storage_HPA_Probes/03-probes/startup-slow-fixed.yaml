# The app needs ~20 s to start. FIX: startupProbe failureThreshold 30 x 2 s = 60 s of start-up budget.
apiVersion: v1
kind: Pod
metadata:
  name: slow-start
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      command: ["sh", "-c", "echo 'warming up for 20s...'; sleep 20; exec nginx -g 'daemon off;'"]
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 2
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
