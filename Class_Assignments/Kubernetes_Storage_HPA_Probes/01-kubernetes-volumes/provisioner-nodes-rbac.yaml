# Fix for minikube's storage-provisioner: with volumeBindingMode WaitForFirstConsumer
# it must read the Node chosen by the scheduler, but its ServiceAccount may not "get nodes".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: storage-provisioner-read-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: storage-provisioner-read-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: storage-provisioner-read-nodes
subjects:
  - kind: ServiceAccount
    name: storage-provisioner
    namespace: kube-system
