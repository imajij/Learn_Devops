# kube-prometheus-stack trimmed for a 4 GB laptop cluster.
#   helm upgrade --install monitoring kube-prometheus-stack \
#     --repo https://prometheus-community.github.io/helm-charts \
#     -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
alertmanager:
  enabled: false
nodeExporter:
  enabled: false             # single minikube node; kubelet/cAdvisor metrics are enough here
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 192Mi}
  admissionWebhooks:
    patch:
      resources: {requests: {cpu: 10m, memory: 32Mi}}
prometheus:
  prometheusSpec:
    retention: 6h
    scrapeInterval: 15s
    resources:
      requests: {cpu: 100m, memory: 300Mi}
      limits: {memory: 700Mi}
    # pick up every ServiceMonitor in the cluster, not only the ones from this Helm release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
grafana:
  adminUser: admin
  adminPassword: campusdesk-grafana-demo   # gitleaks:allow (fake demo value, local cluster only)
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 320Mi}
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
# control-plane components that minikube does not expose -> avoid permanently DOWN targets
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
