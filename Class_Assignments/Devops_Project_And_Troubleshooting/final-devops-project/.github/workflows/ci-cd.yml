# CampusDesk CI/CD + DevSecOps pipeline
#
#   1 build-test ──┬─ 2 sast ────────┐
#                  ├─ 3 sca ─────────┤
#                  ├─ 4 secret-scan ─┼─ 7 security-gate ─ 8 push ─ 9 deploy (Helm -> Kubernetes)
#                  └─ 5 docker-build ─ 6 image-scan ─┘
#
# Scanners only REPORT (JSON artifacts). security/gate.py applies security/gate-policy.json
# and is the single job that can stop the release. Images are tagged with the short Git SHA.
# Real GitHub: REGISTRY=ghcr.io.  Local run with `act`: --var REGISTRY=localhost:5060.
name: CampusDesk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"
  TRIVY_VERSION: "0.75.0"
  HELM_VERSION: "v4.3.0"
  KUBECTL_VERSION: "v1.37.0"
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NS: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}

jobs:
  # 1 ------------------------------------------------------------ BUILD + TEST
  build-test:
    name: "1 Build & unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Install backend dependencies
        working-directory: application/backend
        run: pip install -q -r requirements-dev.txt
      - name: Run pytest (fails the pipeline on any failing test)
        working-directory: application/backend
        run: pytest -v --cov=app --cov-report=term --junitxml=../../reports/junit.xml
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}"}
      - name: Build frontend
        working-directory: application/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          ls -l dist dist/assets
      - name: Upload test report + frontend bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            reports/junit.xml
            application/frontend/dist/

  # 2 -------------------------------------------------------------------- SAST
  sast:
    name: "2 SAST (Bandit)"
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Bandit
        run: |
          pip install -q bandit==1.8.6
          mkdir -p reports
          bandit -c security/bandit.yaml -r application/backend/app -f json -o reports/bandit.json --exit-zero -q
          jq -r '"bandit: \(.results | length) findings  (HIGH=\(.metrics._totals."SEVERITY.HIGH") MEDIUM=\(.metrics._totals."SEVERITY.MEDIUM") LOW=\(.metrics._totals."SEVERITY.LOW"))"' reports/bandit.json
          jq -r '.results[] | "  \(.test_id) \(.issue_severity) \(.filename):\(.line_number) \(.issue_text)"' reports/bandit.json
      - uses: actions/upload-artifact@v4
        with: {name: report-sast, path: reports/}

  # 3 --------------------------------------------------------------------- SCA
  sca:
    name: "3 SCA (pip-audit + npm audit)"
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}"}
      - name: pip-audit (Python dependencies, incl. transitive)
        run: |
          pip install -q pip-audit==2.9.0
          mkdir -p reports
          pip-audit -r application/backend/requirements.txt -f json -o reports/pip-audit.json --progress-spinner off || true
          jq -r '"pip-audit: \(.dependencies | length) packages resolved, \([.dependencies[] | select(.vulns | length > 0)] | length) vulnerable"' reports/pip-audit.json
          jq -r '.dependencies[] | select(.vulns | length > 0) | "  \(.name)==\(.version): \([.vulns[].id] | join(", "))"' reports/pip-audit.json
      - name: npm audit (frontend dependencies from package-lock.json)
        working-directory: application/frontend
        run: |
          npm audit --json > ../../reports/npm-audit.json || true
          jq -r '.metadata.vulnerabilities | "npm audit: total=\(.total) critical=\(.critical) high=\(.high) moderate=\(.moderate) low=\(.low)"' ../../reports/npm-audit.json
      - uses: actions/upload-artifact@v4
        with: {name: report-sca, path: reports/}

  # 4 ------------------------------------------------------------- SECRET SCAN
  secret-scan:
    name: "4 Secret scan (Gitleaks)"
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install Gitleaks
        run: |
          ARCH=$(uname -m); [ "$ARCH" = x86_64 ] && ARCH=x64; [ "$ARCH" = aarch64 ] && ARCH=arm64
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz" | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan working tree and full Git history
        run: |
          mkdir -p reports
          gitleaks dir . --config .gitleaks.toml --redact --no-banner --report-format json --report-path reports/gitleaks.json --exit-code 0
          gitleaks git . --config .gitleaks.toml --redact --no-banner --report-format json --report-path reports/gitleaks-history.json --exit-code 0
          echo "gitleaks: tree=$(jq length reports/gitleaks.json) findings, history=$(jq length reports/gitleaks-history.json) findings"
          jq -s 'add' reports/gitleaks.json reports/gitleaks-history.json > reports/gitleaks-all.json && mv reports/gitleaks-all.json reports/gitleaks.json && rm reports/gitleaks-history.json
      - uses: actions/upload-artifact@v4
        with: {name: report-secrets, path: reports/}

  # 5 ------------------------------------------------------------ DOCKER BUILD
  docker-build:
    name: "5 Docker build"
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend + frontend images (tag = short SHA)
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -q -f docker/backend.Dockerfile  --build-arg APP_VERSION=1.0.0-$TAG -t campusdesk-backend:$TAG .
          docker build -q -f docker/frontend.Dockerfile -t campusdesk-frontend:$TAG .
          docker image ls --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep ":$TAG"
          mkdir -p images
          docker save campusdesk-backend:$TAG  -o images/backend.tar
          docker save campusdesk-frontend:$TAG -o images/frontend.tar
      - uses: actions/upload-artifact@v4
        with: {name: images, path: images/, retention-days: 1}

  # 6 -------------------------------------------------------------- IMAGE SCAN
  image-scan:
    name: "6 Image scan (Trivy)"
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: images, path: images}
      - name: Install Trivy
        run: |
          ARCH=$(uname -m); [ "$ARCH" = x86_64 ] && ARCH=64bit; [ "$ARCH" = aarch64 ] && ARCH=ARM64
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-${ARCH}.tar.gz" | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan both images (OS packages + language packages)
        run: |
          mkdir -p reports
          for img in backend frontend; do
            trivy image --config security/trivy.yaml --input images/$img.tar --format json --output reports/trivy-$img.json --quiet
            jq -r --arg i "$img" '[.Results[].Vulnerabilities[]?] | "trivy \($i): \(length) HIGH/CRITICAL, \([.[] | select(.FixedVersion != null and .FixedVersion != "")] | length) with a fix"' reports/trivy-$img.json
          done
      - uses: actions/upload-artifact@v4
        with: {name: report-images, path: reports/}

  # 7 ----------------------------------------------------------- SECURITY GATE
  security-gate:
    name: "7 Security gate"
    needs: [sast, sca, secret-scan, image-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "report-*", path: reports, merge-multiple: true}
      - name: Apply security/gate-policy.json
        run: |
          ls reports
          python3 security/gate.py reports security/gate-policy.json

  # 8 -------------------------------------------------------------- PUSH IMAGES
  push:
    name: "8 Push images"
    needs: security-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: images, path: images}
      - name: Log in to the registry
        if: env.REGISTRY == 'ghcr.io'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push exactly the images that passed the gate
        id: push
        run: |
          TAG=${GITHUB_SHA::7}
          for img in backend frontend; do
            docker load -q -i images/$img.tar
            TARGET=$(echo "$REGISTRY/$IMAGE_NS/campusdesk-$img:$TAG" | tr '[:upper:]' '[:lower:]')
            docker tag campusdesk-$img:$TAG "$TARGET"
            docker push -q "$TARGET"
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # 9 ------------------------------------------------------------------ DEPLOY
  deploy:
    name: "9 Deploy with Helm"
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ needs.push.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl + Helm
        run: |
          ARCH=$(uname -m); [ "$ARCH" = x86_64 ] && ARCH=amd64; [ "$ARCH" = aarch64 ] && ARCH=arm64
          mkdir -p "$HOME/.local/bin"
          curl -sSLo "$HOME/.local/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${ARCH}.tar.gz" | tar -xz -C /tmp
          mv /tmp/linux-${ARCH}/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cluster access from the KUBE_CONFIG secret
        env: {KUBE_CONFIG: "${{ secrets.KUBE_CONFIG }}"}
        run: |
          mkdir -p ~/.kube && echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
          kubectl get nodes
      - name: helm upgrade --install
        run: |
          helm upgrade --install campusdesk helm/campusdesk -n campusdesk --create-namespace \
            --set imageRegistry=$(echo "$REGISTRY/$IMAGE_NS" | tr '[:upper:]' '[:lower:]') \
            --set backend.image.tag=$TAG --set frontend.image.tag=$TAG \
            --set config.APP_VERSION=1.0.0-$TAG \
            --wait --timeout 5m
          helm history campusdesk -n campusdesk --max 3
          kubectl -n campusdesk get deploy,pods,svc,ingress,hpa,pvc
      - name: Smoke test through the Ingress
        run: |
          INGRESS_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          # the ingress controller needs a few seconds to learn the new endpoints -> retry
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 -H 'Host: campusdesk.localhost' "http://$INGRESS_IP/api/info"; echo
          curl -fsS -H 'Host: campusdesk.localhost' "http://$INGRESS_IP/" | grep -o '<title>.*</title>'
