apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campusdesk.name" . }}-backend
  labels: {{- include "campusdesk.labels" . | nindent 4 }}
    app: {{ include "campusdesk.name" . }}-backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels: {app: {{ include "campusdesk.name" . }}-backend}
  template:
    metadata:
      labels:
        app: {{ include "campusdesk.name" . }}-backend
        tier: api
      annotations:
        # roll the pods when the ConfigMap or Secret content changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        # Wait for PostgreSQL so `alembic upgrade head` does not crash-loop on a cold start.
        # -U is required: uid 10001 has no passwd entry, without it pg_isready says "no attempt".
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          envFrom:
            - configMapRef: {name: {{ include "campusdesk.name" . }}-config}
          command: ["sh", "-c", "until pg_isready -h \"$DB_HOST\" -p \"$DB_PORT\" -U healthcheck; do echo waiting for $DB_HOST; sleep 2; done"]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      containers:
        - name: api
          image: {{ include "campusdesk.image" (dict "root" . "img" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.backend.port }}}]
          envFrom:
            - configMapRef: {name: {{ include "campusdesk.name" . }}-config}
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: {{ include "campusdesk.name" . }}-db, key: db-user}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "campusdesk.name" . }}-db, key: db-password}}
          startupProbe:
            httpGet: {path: {{ .Values.backend.probes.startupPath }}, port: http}
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: {path: {{ .Values.backend.probes.livenessPath }}, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: {{ .Values.backend.probes.readinessPath }}, port: http}
            periodSeconds: 5
            failureThreshold: 2
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "campusdesk.name" . }}-backend
  labels: {{- include "campusdesk.labels" . | nindent 4 }}
    app: {{ include "campusdesk.name" . }}-backend
spec:
  type: {{ .Values.service.type }}
  selector: {app: {{ include "campusdesk.name" . }}-backend}
  ports:
    - {name: http, port: {{ .Values.backend.port }}, targetPort: http}
