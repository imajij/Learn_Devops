# PostgreSQL with persistent storage (PVC). Fine for a classroom cluster;
# production would use a managed database such as Amazon RDS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "campusdesk.name" . }}-pgdata
  labels: {{- include "campusdesk.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep      # never delete ticket data on `helm uninstall`
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.postgres.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.postgres.storage }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campusdesk.name" . }}-postgres
  labels: {{- include "campusdesk.labels" . | nindent 4 }}
    app: {{ include "campusdesk.name" . }}-postgres
spec:
  replicas: 1
  strategy: {type: Recreate}       # RWO volume: never run two DB pods at once
  selector:
    matchLabels: {app: {{ include "campusdesk.name" . }}-postgres}
  template:
    metadata:
      labels: {app: {{ include "campusdesk.name" . }}-postgres, tier: db}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{name: pg, containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: {{ include "campusdesk.name" . }}-config, key: DB_NAME}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "campusdesk.name" . }}-db, key: db-user}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "campusdesk.name" . }}-db, key: db-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ include "campusdesk.name" . }}-pgdata}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "campusdesk.name" . }}-postgres
  labels: {{- include "campusdesk.labels" . | nindent 4 }}
spec:
  selector: {app: {{ include "campusdesk.name" . }}-postgres}
  ports: [{name: pg, port: 5432, targetPort: pg}]
