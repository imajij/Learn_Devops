# Default values for the CampusDesk chart.
# Images come from the local registry container ajij-final-registry (localhost:5060).
# CI overrides backend.image.tag / frontend.image.tag with the short Git SHA.

imageRegistry: localhost:5060/ajij
imagePullPolicy: IfNotPresent

backend:
  image: {repository: campusdesk-backend, tag: dev}
  replicas: 2
  port: 8000
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
  probes:
    startupPath: /health
    livenessPath: /health
    readinessPath: /ready

frontend:
  image: {repository: campusdesk-frontend, tag: dev}
  replicas: 2
  port: 8080
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 64Mi}

# Non-secret settings -> ConfigMap (mounted as env vars with envFrom)
config:
  APP_ENV: minikube
  APP_VERSION: "1.0.0"
  SUPPORT_BANNER: "Campus IT helpdesk - raise a ticket and we will pick it up."
  DB_PORT: "5432"
  DB_NAME: campusdesk

# Credentials -> Secret. FAKE demo values for a throw-away local cluster.
# In a real environment use --set / an external secret manager instead.
database:
  user: campusdesk
  password: campusdesk-demo-pw-2026   # gitleaks:allow (fake demo value)

postgres:
  image: postgres:17-alpine
  storage: 1Gi
  storageClass: ""            # "" = cluster default (minikube: standard / hostpath)
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 500m, memory: 256Mi}

service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: campusdesk.localhost     # *.localhost resolves to 127.0.0.1 in browsers and curl

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 60

monitoring:
  serviceMonitor:
    enabled: false            # turn on once the Prometheus Operator CRDs exist
    interval: 15s
    labels: {release: monitoring}
