# In-cluster Git server (Gitea, rootless, SQLite) - the "GitHub" that Argo CD watches.
# Image mirrored into the local registry:  docker tag gitea/gitea:1.24.6-rootless localhost:5060/mirror/gitea:1.24.6-rootless
apiVersion: v1
kind: Namespace
metadata:
  name: gitops
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: gitea-data, namespace: gitops}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gitea, namespace: gitops, labels: {app: gitea}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: gitea}}
  template:
    metadata: {labels: {app: gitea}}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: gitea
          image: localhost:5060/mirror/gitea:1.24.6-rootless
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GITEA__security__INSTALL_LOCK, value: "true"}
            - {name: GITEA__database__DB_TYPE, value: sqlite3}
            - {name: GITEA__server__HTTP_PORT, value: "3000"}
            - {name: GITEA__server__ROOT_URL, value: "http://gitea.gitops.svc.cluster.local:3000/"}
            - {name: GITEA__server__DISABLE_SSH, value: "true"}
            - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
            - {name: GITEA__repository__DEFAULT_BRANCH, value: main}
            - {name: GITEA__actions__ENABLED, value: "false"}   # CI runs elsewhere (act); no runners here
          readinessProbe: {httpGet: {path: /api/healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/healthz, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/gitea}
            - {name: config, mountPath: /etc/gitea}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: gitea-data}
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: gitea, namespace: gitops}
spec:
  selector: {app: gitea}
  ports: [{name: http, port: 3000, targetPort: http}]
