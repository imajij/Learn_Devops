# Deployment behind the clusterip Service. agnhost "netexec" is a tiny test web server from the
# Kubernetes project (registry.k8s.io, so no Docker Hub limits); GET /hostname returns the pod name,
# which makes load balancing visible.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-clusterip
  labels:
    app: web-clusterip
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-clusterip
  template:
    metadata:
      labels:
        app: web-clusterip
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
