# kube-prometheus-stack values: small footprint for a single-node minikube.
fullnameOverride: kps
alertmanager:
  alertmanagerSpec:
    resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {memory: 128Mi}}
prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 6h
    resources: {requests: {cpu: 200m, memory: 400Mi}, limits: {memory: 1Gi}}
    # pick up ServiceMonitors / PrometheusRules from every namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
grafana:
  adminPassword: admin-lab-only   # throwaway password for a local, already-deleted lab cluster; use a Secret in real setups
  # 256Mi was too small: Grafana (13.2) was OOMKilled while loading the UI (see lab/01b-grafana-oom.txt)
  resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 512Mi}}
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
prometheusOperator:
  resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 192Mi}}
kube-state-metrics:
  resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 96Mi}}
prometheus-node-exporter:
  resources: {requests: {cpu: 10m, memory: 24Mi}, limits: {memory: 64Mi}}
# minikube does not expose these control-plane endpoints, so skip them (they would just show as DOWN)
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
