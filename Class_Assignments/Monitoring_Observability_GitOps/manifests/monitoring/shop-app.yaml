# The instrumented demo app: two Deployments (shop -> payments) from the same image.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: shop
  labels: {app: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: shop}}
  template:
    metadata:
      labels: {app: shop}
    spec:
      containers:
        - name: app
          image: shop-app:1.0
          imagePullPolicy: Never
          env:
            - {name: ROLE, value: shop}
            - {name: PAYMENTS_URL, value: "http://payments.shop.svc:8080/pay"}
            - {name: OTLP_TRACES_URL, value: "http://jaeger.observability.svc:4318/v1/traces"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 96Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
  labels: {app: payments}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments}}
  template:
    metadata:
      labels: {app: payments}
    spec:
      containers:
        - name: app
          image: shop-app:1.0
          imagePullPolicy: Never
          env:
            - {name: ROLE, value: payments}
            - {name: OTLP_TRACES_URL, value: "http://jaeger.observability.svc:4318/v1/traces"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: shop
  labels: {app: shop, monitor: "true"}
spec:
  selector: {app: shop}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: shop
  labels: {app: payments, monitor: "true"}
spec:
  selector: {app: payments}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# Tells the Prometheus Operator to scrape /metrics on every Service labelled monitor=true.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shop-apps
  namespace: shop
  labels: {release: kps}
spec:
  selector: {matchLabels: {monitor: "true"}}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
