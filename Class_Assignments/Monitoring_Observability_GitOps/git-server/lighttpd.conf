server.modules = ("mod_alias", "mod_cgi", "mod_setenv", "mod_accesslog")
server.port = 3000
server.document-root = "/srv/git"
server.errorlog = "/dev/stderr"
accesslog.filename = "/dev/stderr"
# every URL is handed to git-http-backend; repos live under /srv/git
alias.url = ( "/" => "/usr/libexec/git-core/git-http-backend/" )
cgi.assign = ( "" => "" )
setenv.add-environment = (
  "GIT_PROJECT_ROOT" => "/srv/git",
  "GIT_HTTP_EXPORT_ALL" => "1",
  "REMOTE_USER" => "lab"
)
