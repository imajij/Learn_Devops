apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: gitops-demo
  labels: {app: web}
spec:
  replicas: 3
  progressDeadlineSeconds: 60
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: shop-app:1.0
          imagePullPolicy: Never
          env:
            - name: ROLE
              value: shop
            - name: APP_VERSION
              value: "1.1.0"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {cpu: 200m, memory: 64Mi}
