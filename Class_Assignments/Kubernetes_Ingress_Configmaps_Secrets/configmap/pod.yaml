# Three ways to consume a ConfigMap: all keys as env vars, one key as an env var, and as files in a volume.
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      envFrom:
        - configMapRef:
            name: yatri-app-config        # every key becomes an env var
      env:
        - name: CURRENT_LOG_LEVEL         # one key, renamed
          valueFrom:
            configMapKeyRef:
              name: yatri-app-config
              key: LOG_LEVEL
      volumeMounts:
        - name: config
          mountPath: /etc/yatri
          readOnly: true
  volumes:
    - name: config
      configMap:
        name: yatri-app-config            # every key becomes a file
