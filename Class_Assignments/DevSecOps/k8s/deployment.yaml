apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-notes
  namespace: secure-notes
  labels: {app: secure-notes}
spec:
  replicas: 2
  selector:
    matchLabels: {app: secure-notes}
  template:
    metadata:
      labels: {app: secure-notes}
    spec:
      imagePullSecrets:
        - name: regcred                       # created by the deploy job from GitHub secrets
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: __IMAGE__                    # replaced by the pipeline with registry/name:<git-sha>
          ports:
            - containerPort: 8080
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: {name: secure-notes-api, key: token}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}     # gunicorn needs a writable /tmp
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: tmp
          emptyDir: {}
