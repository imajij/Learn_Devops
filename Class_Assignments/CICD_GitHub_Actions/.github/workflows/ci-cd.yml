# CI/CD pipeline for the Task Tracker service.
#   CI  = test  -> build            (runs on every push AND every pull request)
#   CD  = docker -> deploy          (runs only on a push to main, never on a PR)
name: Task Tracker CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # needed only when the registry is GHCR

env:
  PYTHON_VERSION: "3.12"
  # Real GitHub: ghcr.io/<owner>/task-tracker.  Local run with act: --var REGISTRY=localhost:5050
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}/task-tracker

jobs:
  # ------------------------------------------------------------------ CI
  test:
    name: "CI 1/2 - Lint and unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 app tests

      - name: Run unit tests
        run: |
          mkdir -p test-results
          pytest --junitxml=test-results/junit.xml \
                 --cov=app --cov-report=term-missing --cov-report=xml:test-results/coverage.xml

      - name: Upload test report
        if: always()                     # keep the report even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  build:
    name: "CI 2/2 - Build package"
    needs: test                          # build only after tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build application package
        run: ./scripts/build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-tracker-dist
          path: dist/
          retention-days: 7

  # ------------------------------------------------------------------ CD
  docker:
    name: "CD 1/2 - Docker build and push"
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download the CI build artifact
        uses: actions/download-artifact@v4
        with:
          name: task-tracker-dist
          path: dist/

      - name: Show which build is being released
        run: cat dist/build-info.txt

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "repo=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to container registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build image
        run: |
          docker build --build-arg BUILD_SHA=${GITHUB_SHA::7} \
            -t ${{ steps.meta.outputs.image }} -t ${{ steps.meta.outputs.repo }}:latest .

      - name: Push image
        run: |
          docker push ${{ steps.meta.outputs.image }}
          docker push ${{ steps.meta.outputs.repo }}:latest

  deploy:
    name: "CD 2/2 - Deploy to staging"
    needs: docker
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
      CONTAINER: task-tracker-staging
      PORT: "8085"
    steps:
      - name: Authenticate to the deployment target
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # A real pipeline would use this token for SSH / cloud login. GitHub masks it in logs:
          echo "using deploy token: $DEPLOY_TOKEN"
          test -n "$DEPLOY_TOKEN" || { echo "DEPLOY_TOKEN secret is missing"; exit 1; }

      - name: Pull released image from registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          docker pull "$IMAGE"

      - name: Replace the running container
        run: |
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d --name "$CONTAINER" -p "$PORT:5000" -e APP_ENV=staging "$IMAGE"

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -fs "http://localhost:$PORT/health" && break
            sleep 1
          done
          echo; curl -fsS "http://localhost:$PORT/api/stats"
          echo; curl -fsS "http://localhost:$PORT/"
          echo; docker ps --filter "name=$CONTAINER" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
